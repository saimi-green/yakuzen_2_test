<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>薬膳・第２章 食物の性質と作用 理解度テスト</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.2/dist/confetti.browser.min.js"></script>
  <style>
    html {
      font-size: 18px;
      box-sizing: border-box;
    }
    body {
      background: #FADCE7;
      font-family: 'Noto Sans JP', sans-serif;
      color: #4D4D4D;
      margin: 0;
      min-height: 100vh;
      -webkit-text-size-adjust: 100%;
      font-size: 1rem;
    }
    .container {
      max-width: 800px;
      margin: 3rem auto;
      background: #FFF;
      border-radius: 1.25rem;
      box-shadow: 0 2px 16px rgba(0,0,0,0.07);
      padding: 2rem;
      box-sizing: border-box;
    }
    h1, h2 {
      text-align: center;
      margin-top: 0;
      font-size: 2rem;
      line-height: 1.3;
    }
    .quiz-form {
      margin-bottom: 2rem;
    }
    .question-card {
      background: #FFF;
      border-radius: 1rem;
      margin-bottom: 2rem;
      padding: 1.5rem 1rem;
      box-shadow: 0 1px 6px rgba(0,0,0,0.03);
      font-size: 1.08rem;
    }
    .choices {
      margin-top: 1rem;
      display: flex;
      flex-direction: column;
      gap: 0.95rem;
    }
    label {
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 0.7rem;
      font-size: 1.13rem;
      padding: 0.65em 0.3em;
      border-radius: 0.5em;
      min-height: 2.6em;
    }
    input[type=radio] {
      width: 1.3em;
      height: 1.3em;
      accent-color: #F6CDE0;
      margin-right: 0.5em;
      flex-shrink: 0;
    }
    .btn {
      display: inline-block;
      background: #FADCE7;
      color: #4D4D4D;
      border: none;
      border-radius: 0.75rem;
      padding: 0.8em 1.5em;
      font-size: 1.05rem;
      font-family: 'Noto Sans JP', sans-serif;
      margin: 1.5rem auto 0 auto;
      cursor: pointer;
      transition: background 0.2s;
      box-shadow: 0 1px 4px rgba(0,0,0,0.04);
      min-width: 40vw;
      max-width: 100%;
    }
    .btn[aria-label] {
      outline: none;
    }
    .btn:hover, .btn:focus {
      background: #F6CDE0;
    }
    .result {
      margin: 2rem 0 1rem 0;
      text-align: center;
      font-size: 1.2rem;
    }
    .explanation {
      font-size: 1.05rem;
      color: #A64D79;
      margin-top: 0.5rem;
    }
    .confetti-canvas {
      position: fixed;
      left: 0; top: 0; width: 100vw; height: 100vh; pointer-events: none; z-index: 9999;
    }
    @media (max-width: 820px) {
      html { font-size: 16px; }
      .container {
        max-width: 98vw;
        padding: 1.2rem 0.5rem;
        margin: 1.2rem auto;
      }
      h1, h2 {
        font-size: 1.35rem;
      }
      .question-card {
        font-size: 1rem;
        padding: 1.1rem 0.5rem;
      }
      .btn {
        font-size: 0.95rem;
        padding: 0.7em 0.5em;
        min-width: 70vw;
      }
      label {
        font-size: 1.01rem;
        min-height: 2.3em;
        padding: 0.45em 0.2em;
      }
      .choices {
        gap: 0.65rem;
      }
    }
    @media (max-width: 480px) {
      html { font-size: 15px; }
      .container {
        max-width: 100vw;
        padding: 0.4rem 0.1rem;
        margin: 0.5rem auto;
        border-radius: 0.5rem;
      }
      h1, h2 {
        font-size: 1.06rem;
      }
      .question-card {
        font-size: 0.98rem;
        padding: 0.7rem 0.2rem;
        border-radius: 0.5rem;
      }
      .btn {
        font-size: 0.85rem;
        padding: 0.5em 0.2em;
        min-width: 85vw;
      }
      label {
        font-size: 0.99rem;
        min-height: 2em;
        padding: 0.25em 0.1em;
      }
      .choices {
        gap: 0.5rem;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>薬膳・第２章 食物の性質と作用 理解度テスト</h1>
    <form class="quiz-form" autocomplete="off" tabindex="0"></form>
    <div class="result" aria-live="polite"></div>
    <div class="actions" style="text-align:center"></div>
  </div>
  <canvas class="confetti-canvas" id="confetti-canvas" style="display:none;"></canvas>
  <script>
const QUESTIONS = [
  {"q":"「薬食同源」とはどういう意味ですか？","choices":["A. 薬と食べ物は全く別の存在","B. 食べ物と薬は同じ自然の力を持つという考え方","C. 食べ物は効果がなく、薬だけが病気を治す","D. 医薬品はすべて自然由来である"],"ans":"B","exp":"薬も食材も自然の力を活かす、共通の根源を持つという考え方。"},
  {"q":"「性味」とはどの２つの要素のことを指しますか？","choices":["A. 味と香り","B. 味と食感","C. 味と性質","D. 性質と効能"],"ans":"C","exp":"味（五味）と性質（五性）を合わせて性味という。"},
  {"q":"食材を薬膳で分類する際に見る4つの視点（主なもの）はどれ？","choices":["A. 見た目・香り・色・味","B. 味・性質・帰経・効能","C. 季節・地域・価格・調理法","D. 温度・硬さ・重さ・水分量"],"ans":"B","exp":"味・性質・帰経・効能の 4 視点で分類する。"},
  {"q":"以下のうち、「食性」に含まれないものはどれ？","choices":["A. 寒性","B. 熱性","C. 甘味","D. 涼性"],"ans":"C","exp":"甘味は五味の一つで食性ではない。"},
  {"q":"「食性」は基本的に、全部でいくつに分けられますか？","choices":["A. 3つ","B. 4つ","C. 5つ","D. 6つ"],"ans":"C","exp":"寒・涼・平・温・熱の 5 つに分類する。"},
  {"q":"食性の中で最も体を冷やすものは？","choices":["A. 涼性","B. 寒性","C. 平性","D. 微寒性"],"ans":"B","exp":"寒性が最も冷やす力が強い。"},
  {"q":"食材の食性は、1つの食材で複数当てはまることがある。","choices":["○","✕"],"ans":"✕","exp":"1 つの食材は必ず 1 つの食性に属する。"},
  {"q":"調理法によって、食性が変化することがある。","choices":["○","✕"],"ans":"○","exp":"例：蓮根は加熱で寒性→微温性に変わる。"},
  {"q":"「寒性の食材を加熱すると温性になる」ことを説明する食材の例として適切なのは？","choices":["A. 人参","B. 大根","C. 蓮根","D. キャベツ"],"ans":"C","exp":"蓮根は加熱で寒性から微温性に変わる典型例。"},
  {"q":"食材を最も身体を温める方向へ導く調理法は？","choices":["A. 生食","B. 茹でる","C. 焼く","D. 揚げる"],"ans":"D","exp":"揚げる＞炒める＞焼く…の順で温性が増す。"},
  {"q":"温熱性の食材が持つ3つの効能に含まれないものは？","choices":["A. 栄養吸収促進（補益）","B. 気の巡りを良くする（理気）","C. 血行を良くする（活血）","D. 解毒（解毒）"],"ans":"D","exp":"温熱性の代表的効能に解毒は含まれない。"},
  {"q":"薬膳における「証」とは何を意味しますか？","choices":["A. 食材の分類名","B. 西洋医学の薬名","C. 人の体の状態や体質","D. 食材の栄養価"],"ans":"C","exp":"証＝人の体質や状態を表す概念。"},
  {"q":"寒証の人にすすめられるのはどんな食性の食材？","choices":["A. 寒性","B. 涼性","C. 平性","D. 温熱性"],"ans":"D","exp":"温熱性の食材で体を温める。"},
  {"q":"黄帝内経に記された「熱者寒之」の意味は？","choices":["A. 熱がある人には温める","B. 寒がある人には冷やす","C. 熱がある人には冷やす","D. 寒がある人には放置する"],"ans":"C","exp":"熱がある者は冷やして治すという原則。"},
  {"q":"初期感冒とは何を指しますか？","choices":["A. アレルギー反応","B. 風邪のひきはじめ","C. インフルエンザの終盤","D. 夏バテ"],"ans":"B","exp":"風邪のひきはじめを指す。"},
  {"q":"辛温解表と辛涼解表、寒が強いときに選ぶのは？","choices":["A. 辛涼解表","B. 辛温解表","C. 平性解表","D. 補益解表"],"ans":"B","exp":"寒が強い＝身体を温めて発汗させる辛温解表を選ぶ。"},
  {"q":"鼻水が透明でサラサラしているときの対応は？","choices":["A. 辛温解表","B. 辛涼解表","C. 栄養補給","D. 冷やす食材をとる"],"ans":"A","exp":"寒が強いため辛温解表で温め発汗させる。"},
  {"q":"のどが赤く痛みがあり、熱っぽい。どちらの治法を使う？","choices":["A. 辛温解表","B. 辛涼解表","C. 補益解表","D. 理気解表"],"ans":"B","exp":"熱が強いので辛涼解表で熱を散らす。"},
  {"q":"「海老」と「蟹」は薬膳では性質がどう異なりますか？","choices":["A. 両方温性","B. 両方寒性","C. 海老は温性、蟹は寒性","D. 海老は平性、蟹は涼性"],"ans":"C","exp":"海老＝温性、蟹＝寒性。"},
  {"q":"薬膳でよく使われる「ミント（薄荷）」はどちらの治法に使われる？","choices":["A. 辛温解表","B. 辛涼解表","C. 活血作用","D. 補益作用"],"ans":"B","exp":"薄荷は辛涼解表の代表素材。"}
];

const STORAGE_KEY = 'yakuzen-quiz-wrong';

const quizForm = document.querySelector('.quiz-form');
const resultDiv = document.querySelector('.result');
const actionsDiv = document.querySelector('.actions');
const confettiCanvas = document.getElementById('confetti-canvas');

function shuffle(arr) {
  return arr.map(v => [v, Math.random()]).sort((a,b)=>a[1]-b[1]).map(v=>v[0]);
}

function getWrongIndexes() {
  try {
    const data = localStorage.getItem(STORAGE_KEY);
    if (!data) return [];
    return JSON.parse(data);
  } catch { return []; }
}
function setWrongIndexes(indexes) {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(indexes));
}

let quizOrder = [];
let wrongIndexes = [];
let current = 0;
let correctCount = 0;

const QUIZ_LENGTH = 10;
function pickQuizOrder() {
  const wrongIdx = getWrongIndexes();
  let pool = QUESTIONS.map((q, i) => i);
  let order = [];
  // 不正なindexを除外
  const validWrongIdx = Array.isArray(wrongIdx) ? wrongIdx.filter(i => typeof i === 'number' && i >= 0 && i < QUESTIONS.length) : [];
  if (validWrongIdx.length > 0) {
    order = validWrongIdx.slice(0, QUIZ_LENGTH);
    pool = pool.filter(i => !validWrongIdx.includes(i));
  }
  const remain = QUIZ_LENGTH - order.length;
  if (remain > 0) {
    order = order.concat(shuffle(pool).slice(0, remain));
  }
  // 万一空ならランダム10問
  if (!order || order.length === 0) {
    order = shuffle(pool).slice(0, QUIZ_LENGTH);
  }
  return order;
}

function renderCurrentQuestion() {
  quizForm.innerHTML = '';
  resultDiv.textContent = '';
  actionsDiv.innerHTML = '';
  // エラー: 問題データが空
  if (!QUESTIONS || QUESTIONS.length === 0) {
    resultDiv.innerHTML = '<div style="color:#A64D79; font-weight:bold;">問題データがありません。</div>';
    return;
  }
  // quizOrderが空の場合は再初期化
  if (!quizOrder || quizOrder.length === 0) {
    quizOrder = pickQuizOrder();
    current = 0;
  }
  // currentが範囲外の場合もエラー
  if (current < 0) {
    resultDiv.innerHTML = '<div style="color:#A64D79; font-weight:bold;">問題が見つかりません。</div>';
    return;
  }
  // quizOrderの最後まで出題し終わったら結果表示
  if (current >= quizOrder.length) {
    showResult();
    return;
  }
  const qIdx = quizOrder[current];
  const q = QUESTIONS[qIdx];
  const card = document.createElement('div');
  card.className = 'question-card';
  card.tabIndex = 0;
  card.innerHTML = `<div style="font-weight:700;">Q${current+1}. ${q.q}</div>`;
  const choicesDiv = document.createElement('div');
  choicesDiv.className = 'choices';
  q.choices.forEach((choice, j) => {
    const id = `q${current}_c${j}`;
    const input = document.createElement('input');
    input.type = 'radio';
    input.name = `q${current}`;
    input.value = choice[0];
    input.id = id;
    input.tabIndex = 0;
    input.setAttribute('aria-label', choice);
    const label = document.createElement('label');
    label.setAttribute('for', id);
    label.textContent = choice;
    label.tabIndex = 0;
    choicesDiv.appendChild(label);
    label.prepend(input);
  });
  card.appendChild(choicesDiv);
  quizForm.appendChild(card);
  const submitBtn = document.createElement('button');
  submitBtn.type = 'button';
  submitBtn.className = 'btn';
  submitBtn.textContent = '解答する';
  submitBtn.setAttribute('aria-label', '解答する');
  submitBtn.onclick = () => gradeCurrent();
  actionsDiv.appendChild(submitBtn);
}

function gradeCurrent() {
  const qIdx = quizOrder[current];
  const q = QUESTIONS[qIdx];
  const selected = quizForm.querySelector('input[type=radio]:checked');
  const exp = document.createElement('div');
  exp.className = 'explanation';
  let correct = false;
  if (selected && selected.value === q.ans) {
    correct = true;
    correctCount++;
    exp.innerHTML = `正解！ ${q.exp}`;
  } else {
    exp.innerHTML = `間違い！ ${q.exp}`;
    wrongIndexes.push(qIdx);
  }
  quizForm.querySelectorAll('input').forEach(input => input.disabled = true);
  quizForm.querySelector('.question-card').appendChild(exp);
  actionsDiv.innerHTML = '';
  const nextBtn = document.createElement('button');
  nextBtn.type = 'button';
  nextBtn.className = 'btn';
  if (current < QUESTIONS.length - 1) {
    nextBtn.textContent = '次の問題';
    nextBtn.setAttribute('aria-label', '次の問題');
    nextBtn.onclick = () => { current++; renderCurrentQuestion(); };
  } else {
    nextBtn.textContent = '結果を見る';
    nextBtn.setAttribute('aria-label', '結果を見る');
    nextBtn.onclick = () => showResult();
  }
  actionsDiv.appendChild(nextBtn);
}

function showResult() {
  setWrongIndexes(wrongIndexes);
  quizForm.innerHTML = '';
  actionsDiv.innerHTML = '';
  resultDiv.innerHTML = `<strong>${correctCount} / ${QUIZ_LENGTH} 正解</strong>`;
  if (correctCount === QUIZ_LENGTH) {
    showConfetti();
    resultDiv.innerHTML += `<h2 style='margin-top:1.5rem;'>おめでとう！頑張ったね！</h2>`;
  } else {
    resultDiv.innerHTML += `<div style='margin-top:1.5rem; font-size:1.1rem;'>もう少し！もう一度講座を受講して復習してね♪</div>`;
  }
  const retryBtn = document.createElement('button');
  retryBtn.type = 'button';
  retryBtn.className = 'btn';
  retryBtn.textContent = 'もう一度挑戦する';
  retryBtn.setAttribute('aria-label', 'もう一度挑戦する');
  retryBtn.onclick = () => startQuiz();
  actionsDiv.appendChild(retryBtn);
}

function showConfetti() {
  confettiCanvas.style.display = 'block';
  const myConfetti = confetti.create(confettiCanvas, { resize: true, useWorker: true });
  let duration = 3000;
  let end = Date.now() + duration;
  (function frame() {
    myConfetti({
      particleCount: 60,
      spread: 90,
      origin: { y: 0.6 },
      colors: ['#FADCE7', '#F6CDE0', '#FFD1E3', '#FFF', '#A64D79']
    });
    if (Date.now() < end) {
      setTimeout(frame, 250);
    } else {
      setTimeout(() => { confettiCanvas.style.display = 'none'; }, 350);
    }
  })();
}

function startQuiz() {
  if (!QUESTIONS || QUESTIONS.length === 0) {
    quizForm.innerHTML = '';
    resultDiv.innerHTML = '<div style="color:#A64D79; font-weight:bold;">問題データがありません。</div>';
    actionsDiv.innerHTML = '';
    return;
  }
  quizOrder = pickQuizOrder();
  wrongIndexes = [];
  current = 0;
  correctCount = 0;
  renderCurrentQuestion();
}

window.onload = startQuiz;

  </script>
</body>
</html>
